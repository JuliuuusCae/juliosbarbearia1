<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Barbearia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="bg-dark d-flex flex-column min-vh-100">

    <header class="header">
        <div class="header__inner">
            <h1 class="header__logo">Barbearia</h1>
            <nav class="header__nav">
                <a href="{{ url_for('index') }}" class="header__admin-link">Voltar</a>
            </nav>
        </div>
    </header>

    <main class="container mt-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="card p-4 bg-light text-dark" style="max-width: 400px; width: 100%;">
            <h2 class="card-title text-center mb-4">Login do Barbeiro</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-messages mb-3">
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Digite seu usuário" required>
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-warning">Entrar</button>
                </div>
            </form>
        </div>
    </main>

    <script src="/static/script.js"></script>

    <footer class="site-footer">
        <div class="site-footer__inner">
            <div class="site-footer__barber">
                <span class="site-footer__label">Siga a barbearia</span>
                <a href="https://www.instagram.com/julios_barber01?igsh=MWk3N2dldWc1cm96MA==" target="_blank" rel="noopener noreferrer" class="site-footer__social-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
                    @julios_barber01
                </a>
            </div>
            <div class="site-footer__divider"></div>
            <div class="site-footer__dev">
                <span class="site-footer__label">Desenvolvido em 2026 por</span>
                <div class="site-footer__dev-links">
                    <a href="https://www.linkedin.com/in/julio-cesar-ara%C3%BAjo-965639278/" target="_blank" rel="noopener noreferrer" class="site-footer__dev-link site-footer__dev-link--linkedin">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
                        Julio Cesar Araujo
                    </a>
                    <a href="https://github.com/JuliuuusCae" target="_blank" rel="noopener noreferrer" class="site-footer__dev-link site-footer__dev-link--github">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
                        GitHub
                    </a>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
